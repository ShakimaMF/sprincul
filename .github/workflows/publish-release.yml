name: Publish Release

on:
  # Releases the version in main's package.json, tagged v<version>
  workflow_dispatch:
  # Uncomment to trigger automatically whenever a version tag is pushed to main:
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build dist and publish to the release branch
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: false
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Pin the checked-out commit so the tag and the release tree come from the same source
      - name: Read the release tag from package.json
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TAG=v$(bun -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      - name: Fail fast if this tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump the version in package.json; tags are never moved."
            exit 1
          fi

      - name: Switch the working tree to the release branch, at the source commit's content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release
            git switch -C release origin/release
          else
            git switch --orphan release
          fi

          # Replace the whole tree with the source ref's, so files removed since the last
          # release (including any dist/ committed there before) are removed here too
          git read-tree -m -u "$SOURCE_SHA"

      # Build AFTER switching to release: read-tree above deletes any dist/ a prior
      # release left on this branch, so building first would just get thrown away
      - name: Run build
        run: bun run build

      - name: Commit and push the release
        run: |
          git add -f dist/
          git commit -m "release: $TAG"

          git push origin release
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
